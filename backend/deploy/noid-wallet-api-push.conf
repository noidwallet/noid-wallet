# "NOID incoming" notifications. Install as a drop-in:
#   install -D -m 644 deploy/noid-wallet-api-push.conf /etc/systemd/system/noid-wallet-api.service.d/push.conf
#   systemctl daemon-reload && systemctl restart noid-wallet-api
# systemd hands the Firebase key (root-only, /etc/noid) to this service alone,
# at $CREDENTIALS_DIRECTORY/firebase.json.
[Service]
LoadCredential=firebase.json:/etc/noid/firebase-service-account.json
Environment=FCM_SERVICE_ACCOUNT=%d/firebase.json
