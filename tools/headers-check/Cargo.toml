[package]
name = "headers-check"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Checks that the phone's header rules (core/src/headers.rs) match the official noid_chain crate."
publish = false

# Host-only tool, kept out of the core's workspace so the app's lockfile
# never pulls in noid_chain (which links libmdbx and can't build for Android).
[workspace]
resolver = "2"

[dependencies]
noid_mobile_core = { path = "../../core" }
noid_chain = { git = "https://github.com/ignotusnemo/parano1d", rev = "848209d5db75137483cb41a94b310ad11463473f" }
noid_poseidon2b = { git = "https://github.com/ignotusnemo/parano1d", rev = "848209d5db75137483cb41a94b310ad11463473f" }
rand = "0.8"
hex = "0.4"
serde_json = "1"

[profile.release]
opt-level = 3
